<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Primordial Sparks: Manna Economy</title>
  <style>
    body {
      margin: 0;
      background: #030306;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      color: #888;
      user-select: none;
    }
    #ui {
      position: absolute;
      top: 18px;
      left: 18px;
      font-size: 11px;
      letter-spacing: 0.05em;
      background: rgba(8, 8, 14, 0.92);
      padding: 14px 18px;
      border: 1px solid #1e1e2d;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      z-index: 100;
      width: 235px;
    }
    .metrics { line-height: 1.6; }
    .val { color: #fff; font-weight: bold; }
    .control-row { display: flex; flex-direction: column; gap: 4px; }
    .toggle-row { display: flex; justify-content: space-between; align-items: center; }
    .btn-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
    button {
      background: #141420;
      color: #bbb;
      border: 1px solid #2a2a3d;
      padding: 5px 10px;
      font-family: inherit;
      font-size: 10px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
      flex: 1;
    }
    button:hover { background: #222238; color: #fff; border-color: #555577; }
    input[type=range] { width: 100%; accent-color: #73ffe1; background: #141420; cursor: pointer; }
    input[type=checkbox] { accent-color: #73ffe1; cursor: pointer; }
    svg {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }
    svg:active {
      cursor: grabbing;
    }
    line,
    .filament,
    .lineage-memory line,
    .basin-auras circle,
    .shockwaves circle {
      vector-effect: non-scaling-stroke;
    }
  </style>
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <div id="ui">
    <div class="metrics">
      Entities: <span id="count" class="val">1</span> | Max Gen: <span id="gen" class="val">1</span><br/>
      Life State: <span id="lifeState" class="val">Awakening</span><br/>
      Ambient Manna: <span id="mannaCount" class="val">0</span><br/>
      Status: <span id="status" class="val">Running</span><br/>
      Zoom: <span id="zoomLevel" class="val">1.0x</span>
    </div>
    <div class="control-row">
      <label>Speed: <span id="speedVal" class="val">1.0x</span></label>
      <input type="range" id="speedSlider" min="0.1" max="3.0" step="0.1" value="1.0">
    </div>
    <div class="toggle-row">
      <label for="toggleManna">Show Manna Field</label>
      <input type="checkbox" id="toggleManna" checked>
    </div>
    <div class="toggle-row">
      <label for="toggleFilaments">Kinship Filaments</label>
      <input type="checkbox" id="toggleFilaments" checked>
    </div>
    <div class="toggle-row">
      <label for="toggleLineage">Lineage Memory</label>
      <input type="checkbox" id="toggleLineage" checked>
    </div>
    <div class="btn-row">
      <button id="toggleBtn">Pause</button>
      <button id="resetBtn">Reset</button>
      <button id="recenterBtn">Reset View</button>
    </div>
    <div class="btn-row">
      <button id="exportBtn">Export SVG</button>
    </div>
  </div>
  <svg id="stage"></svg>

  <script>
    const width = window.innerWidth;
    const height = window.innerHeight;
    const svg = d3.select("#stage")
      .attr("width", width)
      .attr("height", height)
      .attr("viewBox", `0 0 ${width} ${height}`);

    const defs = svg.append("defs");

    // Glow filter with explicit canvas bounds
    const filter = defs.append("filter")
      .attr("id", "glow")
      .attr("x", "-50%")
      .attr("y", "-50%")
      .attr("width", "200%")
      .attr("height", "200%");
    const glowBlur = filter.append("feGaussianBlur").attr("stdDeviation", "4.5").attr("result", "coloredBlur");
    const feMerge = filter.append("feMerge");
    feMerge.append("feMergeNode").attr("in", "coloredBlur");
    feMerge.append("feMergeNode").attr("in", "SourceGraphic");

    const PALETTE = [
      "#ffffff", "#8ae9ff", "#ff80bf", "#ffea79",
      "#a0ff85", "#c692ff", "#ff9d5c", "#73ffe1"
    ];

    const viewport = svg.append("g").attr("id", "viewport");

    // Canvas background
    const backgroundGroup = viewport.append("g").attr("class", "background");
    backgroundGroup.append("rect")
      .attr("x", -width * 4)
      .attr("y", -height * 4)
      .attr("width", width * 9)
      .attr("height", height * 9)
      .attr("fill", "#030306");

    const basinAuraGroup = viewport.append("g").attr("class", "basin-auras");
    const mannaGroup = viewport.append("g").attr("class", "manna-field");
    const lineageGroup = viewport.append("g").attr("class", "lineage-memory");
    const filamentGroup = viewport.append("g").attr("class", "kinship-filaments");
    const shockwaveGroup = viewport.append("g").attr("class", "shockwaves");
    const sparkGroup = viewport.append("g").attr("class", "sparks");

    let currentZoom = 1.0;

    function getSparkRadius(energy, maxEnergy, zoomK) {
      const baseScreenR = 3.0 + (energy / maxEnergy) * 3.5;
      // When zooming inward (zoomK >= 1), screen radius maintains its exact size (baseScreenR).
      // When zooming outward, scale down with zoom but ensure at least 2px screen visibility.
      const targetScreenR = Math.max(2.0, baseScreenR * Math.min(1, zoomK));
      return targetScreenR / zoomK;
    }

    function getMannaRadius(isBasin, zoomK) {
      const baseScreenR = isBasin ? 2.2 : 1.4;
      const targetScreenR = Math.max(0.8, baseScreenR * Math.min(1, zoomK));
      return targetScreenR / zoomK;
    }

    function updateZoomScale() {
      const scaleFactor = Math.max(1, currentZoom);
      glowBlur.attr("stdDeviation", (4.5 / scaleFactor).toFixed(2));
      sparkGroup.selectAll("circle.spark-core")
        .attr("r", d => getSparkRadius(d.totalEnergy, d.maxEnergy, currentZoom));
      mannaGroup.selectAll("circle.manna")
        .attr("r", d => getMannaRadius(d.isBasin, currentZoom));
    }

    const zoom = d3.zoom()
      .scaleExtent([0.2, 10])
      .on("zoom", (event) => {
        currentZoom = event.transform.k;
        viewport.attr("transform", event.transform);
        d3.select("#zoomLevel").text(currentZoom.toFixed(1) + "x");
        updateZoomScale();
      });

    svg.call(zoom);

    let isRunning = true;
    let simSpeed = 1.0;
    let maxGen = 1;
    let sparks = [];
    let mannaNodes = [];
    let resourceBasins = [];

    let showFilaments = true;
    let showLineage = true;
    let showManna = true;

    function initMannaEconomy() {
      mannaNodes = [];
      resourceBasins = [
        { x: width * 0.32, y: height * 0.38, radius: 180, color: "#8ae9ff", count: 70 },
        { x: width * 0.70, y: height * 0.65, radius: 220, color: "#a0ff85", count: 90 },
        { x: width * 0.50, y: height * 0.22, radius: 140, color: "#ffea79", count: 50 }
      ];

      // Draw faint visible rings marking the resource basins (no crash-prone heavy blurs)
      basinAuraGroup.selectAll("*").remove();
      resourceBasins.forEach(b => {
        basinAuraGroup.append("circle")
          .attr("cx", b.x)
          .attr("cy", b.y)
          .attr("r", b.radius)
          .attr("fill", b.color)
          .attr("fill-opacity", 0.035)
          .attr("stroke", b.color)
          .attr("stroke-width", 1)
          .attr("stroke-opacity", 0.15)
          .attr("stroke-dasharray", "4,4")
          .attr("vector-effect", "non-scaling-stroke");
      });

      // 1. Concentrated basin manna nodes
      resourceBasins.forEach(b => {
        for (let i = 0; i < b.count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const r = Math.sqrt(Math.random()) * b.radius;
          mannaNodes.push({
            id: Math.random(),
            x: b.x + Math.cos(angle) * r,
            y: b.y + Math.sin(angle) * r,
            energy: 8 + Math.random() * 8,
            isBasin: true,
            color: b.color
          });
        }
      });

      // 2. Diffuse background manna specks
      const sparseCount = 130;
      for (let i = 0; i < sparseCount; i++) {
        mannaNodes.push({
          id: Math.random(),
          x: Math.random() * width,
          y: Math.random() * height,
          energy: 3 + Math.random() * 3,
          isBasin: false,
          color: "#e8f4f8"
        });
      }
    }

    function createSpark(x, y, colorIndex = 0, generation = 1) {
      return {
        id: Math.random(),
        x: x,
        y: y,
        px: x,
        py: y,
        vx: (Math.random() - 0.5) * 0.35,
        vy: (Math.random() - 0.5) * 0.35,
        totalEnergy: 80,
        maxEnergy: 160,
        stamina: 0.9,
        drive: 0.2,
        pulseCount: 0,
        lastExpenditure: 0,
        colorIndex: colorIndex,
        generation: generation
      };
    }

    function init() {
      lineageGroup.selectAll("*").remove();
      shockwaveGroup.selectAll("*").remove();
      maxGen = 1;
      initMannaEconomy();
      sparks = [createSpark(width / 2, height / 2, 0, 1)];
      updateUI();
    }

    function updateUI() {
      d3.select("#count").text(sparks.length);
      d3.select("#gen").text(maxGen);
      d3.select("#mannaCount").text(mannaNodes.length);
      d3.select("#status").text(isRunning ? "Running" : "Paused");
      d3.select("#toggleBtn").text(isRunning ? "Pause" : "Play");
      d3.select("#speedVal").text(simSpeed.toFixed(1) + "x");

      if (sparks.length === 1) {
        const s = sparks[0];
        if (s.pulseCount === 0) d3.select("#lifeState").text("Stillness");
        else if (s.pulseCount < 3) d3.select("#lifeState").text("First Sparks");
        else if (s.totalEnergy > 40) d3.select("#lifeState").text("Foraging / Thriving");
        else d3.select("#lifeState").text("Depleted / Starving");
      } else {
        d3.select("#lifeState").text("Community");
      }
    }

    function triggerShockwave(x, y, color, maxRadius, strokeWidth = 1.2) {
      const wave = shockwaveGroup.append("circle")
        .attr("cx", x)
        .attr("cy", y)
        .attr("r", 3 / Math.max(1, currentZoom))
        .attr("fill", "none")
        .attr("stroke", color)
        .attr("stroke-width", strokeWidth)
        .attr("vector-effect", "non-scaling-stroke")
        .attr("opacity", 0.9);

      wave.transition()
        .duration(850 / simSpeed)
        .ease(d3.easeCubicOut)
        .attr("r", maxRadius)
        .attr("stroke-width", 0.05)
        .attr("opacity", 0)
        .remove();
    }

    function evaluatePulse(spark) {
      if (!isRunning || spark.totalEnergy <= 0) return;

      spark.pulseCount++;
      let desiredExpenditure = 0;

      if (spark.pulseCount <= 2) {
        desiredExpenditure = 14 + Math.random() * 6;
      } else if (spark.lastExpenditure > 26) {
        desiredExpenditure = 12 + Math.random() * 6;
      } else if (spark.stamina > 0.5) {
        desiredExpenditure = 28 + Math.random() * 16;
      } else {
        desiredExpenditure = 16 + Math.random() * 8;
      }

      if (spark.totalEnergy - desiredExpenditure < 8) {
        desiredExpenditure = spark.totalEnergy;
      }

      const actualExpenditure = Math.min(spark.totalEnergy, desiredExpenditure);
      spark.totalEnergy -= actualExpenditure;
      spark.lastExpenditure = actualExpenditure;

      spark.stamina = Math.max(0.1, spark.stamina - (actualExpenditure / 42));
      spark.drive = 0.0;

      const color = PALETTE[spark.colorIndex % PALETTE.length];
      triggerShockwave(spark.x, spark.y, color, 45 + actualExpenditure * 2.8, 1.2 + (actualExpenditure / 25));

      updateUI();
    }

    function splitSpark(parent) {
      const idx = sparks.indexOf(parent);
      if (idx === -1) return;
      sparks.splice(idx, 1);

      if (sparks.length >= 28) return;

      triggerShockwave(parent.x, parent.y, "#ffffff", 140, 2.5);

      const angle = Math.random() * Math.PI * 2;
      const kick = 1.9;
      const nextGen = parent.generation + 1;
      maxGen = Math.max(maxGen, nextGen);

      for (let dir of [-1, 1]) {
        const offsetAngle = angle + (dir * Math.PI) / 2;
        const nx = parent.x + Math.cos(offsetAngle) * 8;
        const ny = parent.y + Math.sin(offsetAngle) * 8;

        if (showLineage) {
          lineageGroup.append("line")
            .attr("x1", parent.x)
            .attr("y1", parent.y)
            .attr("x2", nx)
            .attr("y2", ny)
            .attr("stroke", PALETTE[parent.colorIndex % PALETTE.length])
            .attr("stroke-width", 1.0)
            .attr("stroke-opacity", 0.6)
            .attr("stroke-dasharray", "2,2")
            .attr("vector-effect", "non-scaling-stroke");
        }

        const child = createSpark(
          nx,
          ny,
          parent.generation === 1 ? 0 : (Math.random() < 0.7 ? parent.colorIndex : Math.floor(Math.random() * PALETTE.length)),
          nextGen
        );
        child.vx = Math.cos(offsetAngle) * kick;
        child.vy = Math.sin(offsetAngle) * kick;
        sparks.push(child);
      }
      updateUI();
    }

    function checkFilaments() {
      const senseRadius = 180;
      const filaments = [];

      for (let i = 0; i < sparks.length; i++) {
        for (let j = i + 1; j < sparks.length; j++) {
          const a = sparks[i];
          const b = sparks[j];

          if (a.colorIndex === b.colorIndex) {
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const dist = Math.hypot(dx, dy);

            if (dist < senseRadius && dist > 10) {
              const force = (0.06 * simSpeed) / (dist * 0.1);
              a.vx += (dx / dist) * force;
              a.vy += (dy / dist) * force;
              b.vx -= (dx / dist) * force;
              b.vy -= (dy / dist) * force;

              if (showFilaments) {
                filaments.push({
                  x1: a.x, y1: a.y,
                  x2: b.x, y2: b.y,
                  color: PALETTE[a.colorIndex % PALETTE.length],
                  tension: 1 - (dist / senseRadius)
                });
              }
            }
          }
        }
      }
      return filaments;
    }

    function processMannaGrazing() {
      const grazingRadius = 24;
      const consumedIds = new Set();

      sparks.forEach(s => {
        for (let i = 0; i < mannaNodes.length; i++) {
          const m = mannaNodes[i];
          if (consumedIds.has(m.id)) continue;

          const d = Math.hypot(s.x - m.x, s.y - m.y);

          // Gravitational pull toward food
          if (d < grazingRadius * 2.5) {
            s.vx += ((m.x - s.x) / d) * 0.05 * simSpeed;
            s.vy += ((m.y - s.y) / d) * 0.05 * simSpeed;
          }

          // Ingestion
          if (d < grazingRadius) {
            s.totalEnergy = Math.min(s.maxEnergy, s.totalEnergy + m.energy);
            consumedIds.add(m.id);
          }
        }
      });

      if (consumedIds.size > 0) {
        mannaNodes = mannaNodes.filter(m => !consumedIds.has(m.id));
      }

      // Regeneration
      if (Math.random() < 0.25 * simSpeed && mannaNodes.length < 240) {
        if (Math.random() < 0.65) {
          const b = resourceBasins[Math.floor(Math.random() * resourceBasins.length)];
          const angle = Math.random() * Math.PI * 2;
          const r = Math.sqrt(Math.random()) * b.radius;
          mannaNodes.push({
            id: Math.random(),
            x: b.x + Math.cos(angle) * r,
            y: b.y + Math.sin(angle) * r,
            energy: 8 + Math.random() * 8,
            isBasin: true,
            color: b.color
          });
        } else {
          mannaNodes.push({
            id: Math.random(),
            x: Math.random() * width,
            y: Math.random() * height,
            energy: 3 + Math.random() * 3,
            isBasin: false,
            color: "#e8f4f8"
          });
        }
      }
    }

    // Main Loop
    d3.timer(() => {
      let activeFilaments = [];

      if (isRunning) {
        activeFilaments = checkFilaments();
        processMannaGrazing();

        sparks.forEach(s => {
          s.px = s.x;
          s.py = s.y;

          s.x += s.vx * simSpeed;
          s.y += s.vy * simSpeed;
          s.vx *= Math.pow(0.97, simSpeed);
          s.vy *= Math.pow(0.97, simSpeed);
          s.vx += (Math.random() - 0.5) * 0.1 * simSpeed;
          s.vy += (Math.random() - 0.5) * 0.1 * simSpeed;

          // Boundary Reflection
          const pad = 40;
          if (s.x < pad) s.vx += 0.3 * simSpeed;
          if (s.x > width - pad) s.vx -= 0.3 * simSpeed;
          if (s.y < pad) s.vy += 0.3 * simSpeed;
          if (s.y > height - pad) s.vy -= 0.3 * simSpeed;

          // Gentle metabolic cost
          s.totalEnergy = Math.max(0, s.totalEnergy - 0.012 * simSpeed);

          s.stamina = Math.min(1.0, s.stamina + 0.004 * simSpeed);
          s.drive += (0.012 + (1 - s.stamina) * 0.004) * simSpeed;

          const threshold = 1.0 - (s.stamina * 0.35);
          if (s.drive >= threshold) {
            evaluatePulse(s);
          }

          if (showLineage) {
            lineageGroup.append("line")
              .attr("x1", s.px)
              .attr("y1", s.py)
              .attr("x2", s.x)
              .attr("y2", s.y)
              .attr("stroke", PALETTE[s.colorIndex % PALETTE.length])
              .attr("stroke-width", 0.4)
              .attr("stroke-opacity", 0.12)
              .attr("vector-effect", "non-scaling-stroke");
          }
        });

        // Split check
        const readyToSplit = sparks.filter(s => s.totalEnergy <= 0.01 || s.totalEnergy >= s.maxEnergy);
        readyToSplit.forEach(s => splitSpark(s));
      }

      // Render Manna Field
      if (showManna) {
        mannaGroup.style("display", "inline");
        const mannaPoints = mannaGroup.selectAll("circle.manna")
          .data(mannaNodes, d => d.id);

        mannaPoints.enter()
          .append("circle")
          .attr("class", "manna")
          .merge(mannaPoints)
          .attr("cx", d => d.x)
          .attr("cy", d => d.y)
          .attr("r", d => getMannaRadius(d.isBasin, currentZoom))
          .attr("fill", d => d.color)
          .attr("opacity", d => d.isBasin ? 0.75 : 0.45);

        mannaPoints.exit().remove();
      } else {
        mannaGroup.style("display", "none");
      }

      // Render Filaments
      const lines = filamentGroup.selectAll("line.filament")
        .data(showFilaments ? activeFilaments : []);

      lines.enter()
        .append("line")
        .attr("class", "filament")
        .attr("vector-effect", "non-scaling-stroke")
        .merge(lines)
        .attr("x1", d => d.x1)
        .attr("y1", d => d.y1)
        .attr("x2", d => d.x2)
        .attr("y2", d => d.y2)
        .attr("stroke", d => d.color)
        .attr("stroke-width", d => d.tension * 1.8)
        .attr("stroke-opacity", d => d.tension * 0.7)
        .attr("stroke-dasharray", d => d.tension < 0.4 ? "3,3" : "none");

      lines.exit().remove();

      // Render Sparks
      const circles = sparkGroup.selectAll("circle.spark-core")
        .data(sparks, d => d.id);

      circles.enter()
        .append("circle")
        .attr("class", "spark-core")
        .attr("filter", "url(#glow)")
        .merge(circles)
        .attr("cx", d => d.x)
        .attr("cy", d => d.y)
        .attr("r", d => getSparkRadius(d.totalEnergy, d.maxEnergy, currentZoom))
        .attr("fill", d => PALETTE[d.colorIndex % PALETTE.length])
        .attr("opacity", d => 0.45 + (d.stamina * 0.35) + (d.totalEnergy / d.maxEnergy) * 0.2);

      circles.exit().remove();
    });

    d3.select("#toggleBtn").on("click", () => {
      isRunning = !isRunning;
      updateUI();
    });

    d3.select("#resetBtn").on("click", () => init());

    d3.select("#recenterBtn").on("click", () => {
      svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity);
    });

    d3.select("#speedSlider").on("input", function() {
      simSpeed = parseFloat(this.value);
      updateUI();
    });

    d3.select("#toggleManna").on("change", function() {
      showManna = this.checked;
      mannaGroup.style("display", showManna ? "inline" : "none");
      basinAuraGroup.style("display", showManna ? "inline" : "none");
    });

    d3.select("#toggleFilaments").on("change", function() {
      showFilaments = this.checked;
      if (!showFilaments) filamentGroup.selectAll("*").remove();
    });

    d3.select("#toggleLineage").on("change", function() {
      showLineage = this.checked;
      lineageGroup.style("display", showLineage ? "inline" : "none");
    });

    d3.select("#exportBtn").on("click", () => {
      const originalSvg = svg.node();
      const clonedSvg = originalSvg.cloneNode(true);

      clonedSvg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      clonedSvg.setAttribute("xmlns:xlink", "http://www.w3.org/1999/xlink");
      clonedSvg.setAttribute("width", width);
      clonedSvg.setAttribute("height", height);
      clonedSvg.setAttribute("viewBox", `0 0 ${width} ${height}`);

      const styleElem = document.createElementNS("http://www.w3.org/2000/svg", "style");
      styleElem.textContent = `
        line, .filament, .lineage-memory line, .basin-auras circle, .shockwaves circle {
          vector-effect: non-scaling-stroke;
        }
      `;
      clonedSvg.insertBefore(styleElem, clonedSvg.firstChild);

      const serializer = new XMLSerializer();
      const source = '<?xml version="1.0" standalone="no"?>\r\n' + serializer.serializeToString(clonedSvg);

      const blob = new Blob([source], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `primordial-manna-gen${maxGen}.svg`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    });

    init();
  </script>
</body>
</html>
